[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "transcript"
version = "0.1.0"
description = "Extract German vocabulary from a DVD movie: MakeMKV/ffmpeg -> FLAC -> Whisper large-v3 -> spaCy -> flash-card word list"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "faster-whisper>=1.1,<2",
    "spacy>=3.8,<3.9",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# CUDA runtime libs for faster-whisper GPU inference (CTranslate2 needs
# cuBLAS + cuDNN 9); the driver itself comes from Windows on WSL2.
gpu = ["nvidia-cublas-cu12", "nvidia-cudnn-cu12>=9,<10"]
# Apple Silicon: Whisper on the M-series GPU via Metal.
mlx = ["mlx-whisper>=0.4; platform_system == 'Darwin' and platform_machine == 'arm64'"]

[project.scripts]
transcript = "transcript.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
