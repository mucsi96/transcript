[project]
name = "transcript-learner"
version = "0.1.0"
description = "Live German transcript (Speechmatics) + GPT-5 vocabulary learning helper"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "sounddevice>=0.4.7",
    "numpy>=1.26",
    "speechmatics-rt>=1.1",
    "openai>=1.60",
    "spacy>=3.7",
    "python-dotenv>=1.0",
]

[project.scripts]
transcript-learner = "transcript_learner.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
transcript_learner = ["static/*"]
